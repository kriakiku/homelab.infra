---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  interval: 1h
  values:
    # Enable on a node only after Proxmox GPU passthrough exposes /dev/dri:
    #   kubectl label node k8s-1 drm-exporter.enable=true
    nodeSelector:
      drm-exporter.enable: "true"
    hostAccess:
      devDri: /dev/dri
      sys: /sys
    securityContext:
      capabilities:
        add:
          - PERFMON
    monitoring:
      serviceMonitor:
        enabled: false
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
