---
# Allow HTTPRoutes in app namespaces to target the KEDA interceptor proxy.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: httproute-to-interceptor
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ai
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: finance
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: identity
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: productivity
  to:
    - group: ""
      kind: Service
      name: keda-add-ons-http-interceptor-proxy
