---
# HTTPRoute for Penpot frontend via KEDA HTTP interceptor (scale-to-zero).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: penpot
spec:
  hostnames:
    - penpot.1337.pet
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
