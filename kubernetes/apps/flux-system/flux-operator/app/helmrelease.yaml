---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    # Controllers only support error|info|debug — error ≈ warn+error for VL.
    logLevel: error
    serviceMonitor:
      create: false
    web:
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-admin
      # HTTPRoute owned by flux-operator-proxy (oauth2-proxy → Pocket ID).
      httpRoute:
        enabled: false
      networkPolicy:
        create: false
