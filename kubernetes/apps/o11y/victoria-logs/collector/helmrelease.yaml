---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  values:
    fullnameOverride: victoria-logs-collector
    global:
      image:
        registry: quay.io
    podMonitor:
      enabled: false
    remoteWrite:
      - url: http://victoria-logs.o11y.svc.cluster.local:9428
        maxDiskUsagePerURL: 2GB
    collector:
      # Skip CI/media noise and Prometheus config-reloader spam.
      excludeFilter: >-
        kubernetes.pod_namespace:in(actions-runner-system, media)
        or kubernetes.container_name:in(config-reloader, prometheus-config-reloader, rules-configmap-reloader)
      streamFields:
        - kubernetes.pod_name
        - kubernetes.pod_namespace
        - kubernetes.container_name
        - kubernetes.pod_labels.app.kubernetes.io/name
    extraArgs:
      "kubernetesCollector.decolorizeFields": _msg
