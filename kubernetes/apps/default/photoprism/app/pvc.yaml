---
# NVMe PVC for MariaDB data (fast, small)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-db
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
# NVMe PVC for PhotoPrism storage (thumbnails, cache, sidecar files)
# Thumbnails alone can reach 20-30 GB for large libraries.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-storage
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
