---
alerting:
  gotify:
    url: https://gotify.1337.pet
    token: ${GOTIFY_GATUS_TOKEN}
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2
    title: Gatus

endpoints: []

external-endpoints:
  - name: Heartbeat
    group: buddy
    token: ${BUDDY_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: gotify
