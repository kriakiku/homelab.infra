---
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-oidc-init
data:
  99-oidc-providers: |
    #!/usr/bin/env bash
    set -euo pipefail
    python3 - <<'PY'
    import json
    import os

    providers = {
        "openid_connect": {
            "SCOPE": ["openid", "profile", "email"],
            "OAUTH_PKCE_ENABLED": True,
            "APPS": [
                {
                    "provider_id": "pocket-id",
                    "name": "Pocket ID",
                    "client_id": os.environ["OIDC_CLIENT_ID"],
                    "secret": os.environ["OIDC_CLIENT_SECRET"],
                    "settings": {
                        "server_url": "https://auth.1337.pet",
                        "fetch_userinfo": True,
                    },
                }
            ],
        }
    }
    path = "/run/s6/container_environment/PAPERLESS_SOCIALACCOUNT_PROVIDERS"
    with open(path, "w", encoding="utf-8") as handle:
        handle.write(json.dumps(providers, separators=(",", ":")))
    print(f"[oidc-init] wrote {path}")
    PY
