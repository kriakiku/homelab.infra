---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.11.1/dist/schemas/pocketidusergroup_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDUserGroup
metadata:
  name: one-api
spec:
  friendlyName: One API
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.11.1/dist/schemas/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: one-api
spec:
  name: One API
  clientID: one-api
  pkceEnabled: false
  skipConsent: true
  callbackUrls:
    - https://one-api.1337.pet/oauth/oidc
  logo:
    nameOverride: one-api
  allowedUserGroups:
    - name: one-api
  secret:
    name: one-api-oidc-credentials
    keys:
      clientID: client_id
      clientSecret: client_secret
      issuerUrl: issuer_url
      discoveryUrl: discovery_url
