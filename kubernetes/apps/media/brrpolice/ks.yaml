---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: brrpolice
spec:
  # Temporary: media stack powered down to cut idle CPU/noise. Remove suspend to restore.
  suspend: true
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/zeroscaler
  interval: 1h
  path: ./kubernetes/apps/media/brrpolice/app
  postBuild:
    substitute:
      APP: brrpolice
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
