---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
spec:
  chartRef:
    kind: OCIRepository
    name: linkwarden
  interval: 1h
  values:
    controllers:
      linkwarden:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress: "true"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-db:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18.1-system-trixie
            env:
              PGHOST: main-db-rw.databases.svc.cluster.local
              PGPORT: "5432"
              PGUSER: linkwarden
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-secret
                    key: DB_PASSWORD
              PGDATABASE: postgres
            command:
              - /bin/bash
              - -ec
              - |
                until pg_isready -q; do sleep 2; done
                psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
                SELECT 'CREATE DATABASE linkwarden OWNER linkwarden'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'linkwarden')\gexec
                SQL
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
        containers:
          app:
            image:
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.16.0@sha256:d805877fb707d160b809027c302f84cfba11a248d7fdc12de90b4791f98e6b55
            env:
              NEXTAUTH_URL: https://linkwarden.1337.pet/api/v1/auth
              BASE_URL: https://linkwarden.1337.pet
              NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
              NEXT_PUBLIC_CREDENTIALS_ENABLED: "false"
              NEXT_PUBLIC_OIDC_ENABLED: "true"
              OIDC_CUSTOM_NAME: Pocket ID
              OIDC_WELLKNOWN_URL: http://pocket-id.identity.svc.cluster.local:1411/.well-known/openid-configuration
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-oidc-credentials
                    key: client_id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-oidc-credentials
                    key: client_secret
              MEILI_HOST: http://localhost:7700
              SPACES_ENDPOINT: http://seaweedfs.storage.svc.cluster.local:8333
              SPACES_BUCKET_NAME: linkwarden
              SPACES_REGION: us-east-1
              SPACES_FORCE_PATH_STYLE: "true"
              NEXT_PUBLIC_EMAIL_PROVIDER: "true"
              EMAIL_FROM: linkwarden@kriakiku.dev
              EMAIL_SERVER: smtp://smtp-relay.mail.svc.cluster.local:25
              TZ: Europe/Vilnius
            envFrom:
              - secretRef:
                  name: linkwarden-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 5
            # Playwright/Chromium in the image expects a privileged-enough root user.
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
                add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE, SYS_ADMIN]
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
          meilisearch:
            image:
              repository: getmeili/meilisearch
              tag: v1.14.0
            env:
              MEILI_ENV: production
              MEILI_NO_ANALYTICS: "true"
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: linkwarden-secret
                    key: MEILI_MASTER_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &meiliPort 7700
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *meiliPort
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: linkwarden
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          item.homer.rajsingh.info/name: "Linkwarden"
          item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/linkwarden.png"
          item.homer.rajsingh.info/subtitle: "Bookmark Manager"
          service.homer.rajsingh.info/name: "Personal"
          service.homer.rajsingh.info/icon: "fa-solid fa-bookmark"
        hostnames:
          - linkwarden.1337.pet
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      meili-data:
        type: emptyDir
        advancedMounts:
          linkwarden:
            meilisearch:
              - path: /meili_data
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          linkwarden:
            app:
              - path: /tmp
