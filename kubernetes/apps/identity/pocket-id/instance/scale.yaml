---
# Scale Pocket ID to zero when idle. Hosts cover public auth + in-cluster OIDC callers
# that go through pocket-id-oidc ExternalName (interceptor :8080).
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: pocket-id
spec:
  target:
    service: pocket-id
    port: 1411
  rules:
    - hosts:
        - auth.1337.pet
        - pocket-id-oidc
        - pocket-id-oidc.identity
        - pocket-id-oidc.identity.svc
        - pocket-id-oidc.identity.svc.cluster.local
  scalingMetric:
    concurrency:
      targetValue: 1
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pocket-id
spec:
  scaleTargetRef:
    name: pocket-id
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 600
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda.svc.cluster.local:9090
        interceptorRoute: pocket-id
---
# In-cluster OIDC token/userinfo callers use this → interceptor :8080.
apiVersion: v1
kind: Service
metadata:
  name: pocket-id-oidc
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
    - name: http
      port: 8080
