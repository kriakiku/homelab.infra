---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: photoprism
spec:
  # No kopiur: originals live on NFS HDD (source of truth from Google/iCloud).
  # Cache/thumbs on NFS NVMe; MariaDB can be dumped separately later if needed.
  dependsOn:
    - name: pocket-id
  interval: 1h
  path: ./kubernetes/apps/default/photoprism/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
