---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-db
spec:
  instances: 1

  bootstrap:
    initdb:
      database: main
      owner: main
      secret:
        name: main-db-owner-secret

  storage:
    size: 10Gi
    storageClass: local-path

  # Shared instance backing 9 app databases (pocketid, gatus, paperless,
  # linkwarden, vaultwarden, mailarchiver, penpot, kestra, oneapi).
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  managed:
    roles:
      - name: pocketid
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: main-db-pocketid-secret
      - name: gatus
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: main-db-gatus-secret
      - name: paperless
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: main-db-paperless-secret
      - name: linkwarden
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: main-db-linkwarden-secret
      - name: vaultwarden
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: main-db-vaultwarden-secret
      - name: mailarchiver
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: main-db-mailarchiver-secret
      - name: penpot
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: main-db-penpot-secret
      - name: kestra
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: main-db-kestra-secret
      - name: oneapi
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: main-db-oneapi-secret

  monitoring:
    enablePodMonitor: true

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/
      endpointURL: http://seaweedfs.storage.svc.cluster.local:8333
      s3Credentials:
        accessKeyId:
          name: seaweedfs-s3-secret
          key: SEAWEEDFS_S3_ACCESS_KEY
        secretAccessKey:
          name: seaweedfs-s3-secret
          key: SEAWEEDFS_S3_SECRET_KEY
      wal:
        compression: gzip
        encryption: AES256
      data:
        compression: gzip
        encryption: AES256
        immediateCheckpoint: true
    retentionPolicy: "30d"
