---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wallos
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/keda-http-scale
  dependsOn:
    - name: pocket-id
      namespace: identity
    - name: keda-http-add-on
      namespace: keda
  interval: 1h
  path: ./kubernetes/apps/finance/wallos/app
  postBuild:
    substitute:
      APP: wallos
      SERVICE: wallos
      DEPLOYMENT: wallos
      PORT: "80"
      HOST: wallos.1337.pet
      COOLDOWN: "600"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: finance
  wait: false
