---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homer-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: homer-proxy
  interval: 1h
  values:
    controllers:
      homer-proxy:
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/oauth2-proxy/oauth2-proxy
              tag: v7.15.3@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
            env:
              OAUTH2_PROXY_PROVIDER: oidc
              OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.1337.pet
              OAUTH2_PROXY_REDIRECT_URL: https://homer.1337.pet/oauth2/callback
              OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
              # Dashboard CR `homer` creates Service/Deployment `homer-homer`.
              OAUTH2_PROXY_UPSTREAMS: http://homer-homer.network.svc.cluster.local:80
              OAUTH2_PROXY_EMAIL_DOMAINS: "*"
              OAUTH2_PROXY_SCOPE: "openid email profile"
              OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
              OAUTH2_PROXY_COOKIE_SECURE: "true"
              OAUTH2_PROXY_REVERSE_PROXY: "true"
              OAUTH2_PROXY_PASS_USER_HEADERS: "true"
              OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
              OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
              OAUTH2_PROXY_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: homer-oidc-credentials
                    key: client_id
              OAUTH2_PROXY_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: homer-oidc-credentials
                    key: client_secret
              OAUTH2_PROXY_COOKIE_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: homer-proxy-secret
                    key: OAUTH2_PROXY_COOKIE_SECRET
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &port 4180
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

    service:
      app:
        controller: homer-proxy
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - homer.1337.pet
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              # Via KEDA HTTP interceptor — holds while homer-proxy scales 0→1.
              - name: keda-add-ons-http-interceptor-proxy
                namespace: keda
                port: 8080
