---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
spec:
  chartRef:
    kind: OCIRepository
    name: vaultwarden
  interval: 1h
  values:
    controllers:
      vaultwarden:
        replicas: 0
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18.1-system-trixie
            env:
              PGHOST: main-db-rw.databases.svc.cluster.local
              PGPORT: "5432"
              PGUSER: vaultwarden
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: vaultwarden-secret
                    key: DB_PASSWORD
              PGDATABASE: postgres
            command:
              - /bin/bash
              - -ec
              - |
                until pg_isready -q; do sleep 2; done
                psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
                SELECT 'CREATE DATABASE vaultwarden OWNER vaultwarden'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vaultwarden')\gexec
                SQL
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
        containers:
          app:
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.37.0-alpine@sha256:88b74551f5d79fd43f897c23bd74d5295a6e1fafb5d1ec23a1da92e7a0f06767
            env:
              DOMAIN: https://vaultwarden.1337.pet
              # Official images no longer ship OpenDAL/S3; keep data on local-path PVC.
              DATA_FOLDER: /data
              TMP_FOLDER: /tmp
              SIGNUPS_ALLOWED: "false"
              INVITATIONS_ALLOWED: "true"
              SHOW_PASSWORD_HINT: "false"
              WEBSOCKET_ENABLED: "true"
              SSO_ENABLED: "true"
              SSO_ONLY: "false"
              SSO_PKCE: "true"
              SSO_SIGNUPS_MATCH_EMAIL: "true"
              SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: "true"
              SSO_SCOPES: email profile groups offline_access
              SSO_AUTHORITY: https://auth.1337.pet
              SSO_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: vaultwarden-oidc-credentials
                    key: client_id
              SSO_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: vaultwarden-oidc-credentials
                    key: client_secret
              SMTP_HOST: smtp-relay.mail.svc.cluster.local
              SMTP_FROM: vaultwarden@kriakiku.dev
              SMTP_FROM_NAME: Vaultwarden
              SMTP_PORT: "25"
              SMTP_SECURITY: off
              TZ: Europe/Vilnius
            envFrom:
              - secretRef:
                  name: vaultwarden-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: &port 80
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: vaultwarden
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          item.homer.rajsingh.info/name: "Vaultwarden"
          item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vaultwarden.png"
          item.homer.rajsingh.info/subtitle: "Password Manager"
          service.homer.rajsingh.info/name: "Security"
          service.homer.rajsingh.info/icon: "fa-solid fa-shield-halved"
        hostnames:
          - vaultwarden.1337.pet
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: keda-add-ons-http-interceptor-proxy
                namespace: keda
                port: 8080

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: local-path
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        globalMounts:
          - path: /tmp
