---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  valuesFrom:
    - kind: ConfigMap
      name: flux-metrics-configmap
      valuesKey: flux-metrics.yaml
  values:
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.1337.pet
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        replicas: 1
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.1337.pet
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              resources:
                requests:
                  storage: 1Gi
    # Control-plane component scrapes are noisy / often empty on Talos.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.1337.pet
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        replicas: 1
        externalUrl: https://prometheus.1337.pet
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # ~1.5 days — keep RAM/disk light on the single worker.
        retention: 36h
        retentionSize: 4GB
        scrapeInterval: 1m
        evaluationInterval: 1m
        securityContext:
          # Dropped capabilities remove DAC_OVERRIDE, so uid must own the volume.
          # local-path/XFS + seclabel: run as 1000 (not root) matching init chown.
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
        hostUsers: true
        initContainers:
          - name: fix-permissions
            image: busybox:1.36
            command:
              - sh
              - -c
              - |
                mkdir -p /prometheus/prometheus-db
                chown -R 1000:1000 /prometheus
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              capabilities:
                add: [CHOWN, FOWNER, DAC_OVERRIDE]
            volumeMounts:
              - name: prometheus-kube-prometheus-stack-db
                mountPath: /prometheus
                # Must prepare prometheus-db before the main container mounts it via subPath
                # (kubelet otherwise creates the subPath as root and prometheus cannot write).
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1280Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              resources:
                requests:
                  # Existing PVC will not shrink; retentionSize caps on-disk usage.
                  storage: 10Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      # Skip high-churn / low-value collectors for a small homelab.
      collectors:
        - certificatesigningrequests
        - cronjobs
        - daemonsets
        - deployments
        - jobs
        - namespaces
        - nodes
        - persistentvolumeclaims
        - persistentvolumes
        - pods
        - replicasets
        - statefulsets
        - storageclasses
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: o11y
        matchLabels:
          dashboards: grafana
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
