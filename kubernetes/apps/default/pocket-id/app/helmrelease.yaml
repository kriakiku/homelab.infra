---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
spec:
  chartRef:
    kind: OCIRepository
    name: pocket-id
  interval: 1h
  values:
    controllers:
      pocket-id:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.11.0
            env:
              APP_URL: https://auth.1337.pet
              TRUST_PROXY: "true"
              UI_CONFIG_DISABLED: "true"
              SESSION_DURATION: "1440"
              ALLOW_USER_SIGNUPS: disabled
              FILE_BACKEND: s3
              S3_BUCKET: pocket-id
              S3_REGION: us-east-1
              S3_ENDPOINT: http://seaweedfs.storage.svc.cluster.local:8333
              S3_FORCE_PATH_STYLE: "true"
              SMTP_HOST: smtp-relay.default.svc.cluster.local
              SMTP_PORT: "25"
              SMTP_FROM: auth@kriakiku.dev
              SMTP_TLS: none
            envFrom:
              - secretRef:
                  name: pocket-id-secret
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 1411
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 1411
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 1411
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: pocket-id
        ports:
          http:
            port: 1411
    route:
      app:
        hostnames:
          - auth.1337.pet
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 1411
