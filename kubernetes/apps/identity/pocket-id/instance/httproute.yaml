---
# Pocket ID via KEDA HTTP interceptor (scale-to-zero on idle).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id
  annotations:
    item.homer.rajsingh.info/name: "Pocket ID"
    item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/pocket-id.png"
    item.homer.rajsingh.info/subtitle: "Identity Provider / SSO"
    service.homer.rajsingh.info/name: "Security"
    service.homer.rajsingh.info/icon: "fa-solid fa-shield-halved"
spec:
  hostnames:
    - auth.1337.pet
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
