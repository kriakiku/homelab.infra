---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: gdrive
spec:
  allowedNamespaces:
    all: true
  # Allow projecting repo credentials into workload namespaces for movers.
  credentialProjection:
    allowed: true
  backend:
    # OAuth Drive via rclone (same remote as restic). Native kopia gdrive
    # wants a service-account JSON; we only have an OAuth client.
    rclone:
      remotePath: gdrive:homelab-backups/kopiur
      configSecretRef:
        name: kopiur-repository-secret
        namespace: kopiur-system
      startupTimeout: 2m
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  scheduleDefaults:
    timezone: America/New_York
