---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  interval: 1h
  chart:
    spec:
      chart: keda
      version: "2.20.1"
      sourceRef:
        kind: HelmRepository
        name: kedacore
  values:
    # Chart defaults cpu limits to 1 core each; override with modest caps.
    resources:
      operator:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          cpu: 200m
          memory: 384Mi
      metricServer:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      webhooks:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    prometheus:
      operator:
        enabled: true
        serviceMonitor:
          enabled: true
      metricServer:
        enabled: true
        serviceMonitor:
          enabled: true
      webhooks:
        enabled: true
        serviceMonitor:
          enabled: true
