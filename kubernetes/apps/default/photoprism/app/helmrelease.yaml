---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: photoprism
spec:
  chartRef:
    kind: OCIRepository
    name: photoprism
  interval: 1h
  values:
    controllers:
      photoprism:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress: "true"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-db:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18.1-system-trixie
            env:
              PGHOST: main-db-rw.databases.svc.cluster.local
              PGPORT: "5432"
              PGUSER: photoprism
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: photoprism-secret
                    key: PHOTOPRISM_DATABASE_PASSWORD
              PGDATABASE: postgres
            command:
              - /bin/bash
              - -ec
              - |
                until pg_isready -q; do sleep 2; done
                psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
                SELECT 'CREATE DATABASE photoprism OWNER photoprism'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'photoprism')\gexec
                SQL
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }

        containers:
          app:
            image:
              # Preview build with PostgreSQL support (feature/postgresql).
              # https://hub.docker.com/r/photoprism/photoprism/tags?name=postgres
              repository: docker.io/photoprism/photoprism
              tag: 260523-postgres@sha256:86171a4baf4bd8523478a0f3e93b03894a841d928d94879603b55ea8528ee134
            env:
              # Site
              PHOTOPRISM_SITE_URL: https://photoprism.1337.pet/
              PHOTOPRISM_SITE_TITLE: PhotoPrism
              PHOTOPRISM_ORIGINALS_LIMIT: "0"
              TZ: Europe/Vilnius
              # Auth — keep password login for admin fallback
              PHOTOPRISM_AUTH_MODE: password
              PHOTOPRISM_ADMIN_USER: admin
              PHOTOPRISM_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: photoprism-secret
                    key: PHOTOPRISM_ADMIN_PASSWORD
              # OIDC — from pocket-id-operator (optional: pod starts even without secret)
              PHOTOPRISM_OIDC_URI: https://auth.1337.pet
              PHOTOPRISM_OIDC_PROVIDER: Pocket ID
              PHOTOPRISM_OIDC_REGISTER: "true"
              PHOTOPRISM_OIDC_REDIRECT: "false"
              PHOTOPRISM_OIDC_SCOPES: openid email profile
              PHOTOPRISM_OIDC_CLIENT:
                valueFrom:
                  secretKeyRef:
                    name: photoprism-oidc-credentials
                    key: client_id
                    optional: true
              PHOTOPRISM_OIDC_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: photoprism-oidc-credentials
                    key: client_secret
                    optional: true
              # Database — shared CNPG main-db (PostgreSQL preview image)
              PHOTOPRISM_DATABASE_DRIVER: postgres
              PHOTOPRISM_DATABASE_SERVER: main-db-rw.databases.svc.cluster.local:5432
              PHOTOPRISM_DATABASE_NAME: photoprism
              PHOTOPRISM_DATABASE_USER: photoprism
              PHOTOPRISM_DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: photoprism-secret
                    key: PHOTOPRISM_DATABASE_PASSWORD              # Storage paths
              PHOTOPRISM_ORIGINALS_PATH: /photos/originals
              PHOTOPRISM_IMPORT_PATH: /photos/import
              PHOTOPRISM_STORAGE_PATH: /storage
              # Performance
              PHOTOPRISM_WORKERS: "2"
              PHOTOPRISM_DISABLE_CHOWN: "false"
              PHOTOPRISM_DISABLE_TLS: "true"
              PHOTOPRISM_DEFAULT_TLS: "false"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: &port 2342
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  failureThreshold: 90
                  periodSeconds: 5
            # PhotoPrism init script runs as root then drops to UID
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
                add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
            resources:
              requests:
                cpu: 200m
                memory: 768Mi
              limits:
                memory: 4Gi

    service:
      app:
        controller: photoprism
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          item.homer.rajsingh.info/name: "PhotoPrism"
          item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/photoprism.png"
          item.homer.rajsingh.info/subtitle: "Photo Library"
          service.homer.rajsingh.info/name: "Personal"
          service.homer.rajsingh.info/icon: "fa-solid fa-images"
        hostnames:
          - photoprism.1337.pet
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      # Cache / thumbnails / sidecar — NFS NVMe (regenerable; originals stay on HDD)
      storage:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.1337.pet
            path: /export/nvme/photos/storage
        advancedMounts:
          photoprism:
            app:
              - path: /storage

      # Photos originals — HDD NFS (Google / iCloud imports land here)
      photos-originals:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.1337.pet
            path: /export/hdd/photos/originals
        advancedMounts:
          photoprism:
            app:
              - path: /photos/originals

      # Import folder — HDD NFS
      photos-import:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.1337.pet
            path: /export/hdd/photos/import
        advancedMounts:
          photoprism:
            app:
              - path: /photos/import

      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        globalMounts:
          - path: /tmp
