---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aclerici38/pocket-id-operator/v0.11.1/dist/schemas/pocketidinstance_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDInstance
metadata:
  name: pocket-id
spec:
  image: ghcr.io/pocket-id/pocket-id:v2.11.0
  appUrl: https://auth.1337.pet
  encryptionKey:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: ENCRYPTION_KEY
  databaseUrl:
    valueFrom:
      secretKeyRef:
        name: pocket-id-secret
        key: DB_CONNECTION_STRING
  trustedProxies:
    enabled: true
  s3:
    bucket: pocket-id
    region: us-east-1
    endpoint: http://seaweedfs.storage.svc.cluster.local:8333
    forcePathStyle: true
    accessKeyId:
      valueFrom:
        secretKeyRef:
          name: pocket-id-secret
          key: S3_ACCESS_KEY_ID
    secretAccessKey:
      valueFrom:
        secretKeyRef:
          name: pocket-id-secret
          key: S3_SECRET_ACCESS_KEY
  smtp:
    host: smtp-relay.mail.svc.cluster.local
    port: 25
    from: auth@kriakiku.dev
    tls: none
  geoip:
    maxmindLicenseKey:
      valueFrom:
        secretKeyRef:
          name: pocket-id-secret
          key: MAXMIND_LICENSE_KEY
  ui:
    sessionDuration: 1440
  userManagement:
    allowUserSignups: disabled
  route:
    enabled: true
    parentRefs:
      - name: envoy-external
        namespace: network
    template:
      metadata:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /healthz
      port: 1411
  readinessProbe:
    httpGet:
      path: /healthz
      port: 1411
  podTemplate:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
