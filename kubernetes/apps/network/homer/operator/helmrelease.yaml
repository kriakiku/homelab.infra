---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homer-operator
spec:
  chartRef:
    kind: OCIRepository
    name: homer-operator
  interval: 1h
  values:
    operator:
      # Enable Gateway API (HTTPRoute) discovery in addition to Ingress.
      enableGatewayAPI: true
      reconcileInterval: "60s"
      metrics:
        # Avoid kube-rbac-proxy sidecar — one container is enough for homelab.
        enabled: false
        secureMetrics: false
        rbacProxy:
          image:
            repository: quay.io/brancz/kube-rbac-proxy
            tag: v0.18.2
            pullPolicy: IfNotPresent
    replicaCount: 1
    serviceMonitor:
      enabled: false
      # Scrape manager :8080 directly (secureMetrics=false).
      endpoints:
        - port: metrics
          path: /metrics
          interval: 30s
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    homer:
      image:
        repository: ghcr.io/bastienwirtz/homer
        tag: latest
