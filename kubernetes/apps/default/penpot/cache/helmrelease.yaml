---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: penpot-cache
spec:
  chartRef:
    kind: OCIRepository
    name: penpot-cache
  interval: 1h
  values:
    controllers:
      penpot-cache:
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 8.1-alpine
            args:
              - --maxmemory
              - 256mb
              - --maxmemory-policy
              - volatile-lfu
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [sh, -c, "valkey-cli ping | grep -q PONG"]
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [sh, -c, "valkey-cli ping | grep -q PONG"]
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 320Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    service:
      app:
        controller: penpot-cache
        ports:
          redis:
            port: 6379

    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp
