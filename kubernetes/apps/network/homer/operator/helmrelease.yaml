---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homer-operator
spec:
  chartRef:
    kind: OCIRepository
    name: homer-operator
  interval: 1h
  values:
    operator:
      # Enable Gateway API (HTTPRoute) discovery in addition to Ingress.
      enableGatewayAPI: true
      reconcileInterval: "60s"
      metrics:
        enabled: true
        # gcr.io/kubebuilder/kube-rbac-proxy:v0.16.0 is unpublished; scrape :8080 directly.
        secureMetrics: false
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    homer:
      image:
        repository: ghcr.io/bastienwirtz/homer
        tag: latest
