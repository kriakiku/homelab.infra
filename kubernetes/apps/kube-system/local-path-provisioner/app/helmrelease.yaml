---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
spec:
  chart:
    spec:
      chart: local-path-provisioner
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
        namespace: kube-system
      version: 0.x
  interval: 1h
  values:
    storageClass:
      defaultClass: true
      name: local-path
    # PVCs (CNPG, Prometheus, kopiur, …) must land on k8s-1's second disk
    # (/var/mnt/local-hostpath from Talos UserVolumeConfig), never on the
    # 32GB OS disk or on the control-plane.
    nodePathMap:
      - node: k8s-1
        paths:
          - /var/mnt/local-hostpath
      - node: k8s-0
        paths: []
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths: []
