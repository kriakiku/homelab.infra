---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
spec:
  dependsOn:
    - name: pocket-id
      namespace: identity
    - name: nfs-mkdir
      namespace: storage
    - name: keda-http-add-on
      namespace: keda
  interval: 1h
  path: ./kubernetes/apps/documents/paperless/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: documents
  wait: false
