---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: penpot-cache
spec:
  interval: 1h
  path: ./kubernetes/apps/productivity/penpot/cache
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: productivity
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: penpot
spec:
  components:
    - ../../../../components/keda-http-scale
  dependsOn:
    - name: penpot-cache
    - name: pocket-id
      namespace: identity
    - name: cloudnative-pg-clusters
      namespace: databases
    - name: keda-http-add-on
      namespace: keda
  interval: 1h
  path: ./kubernetes/apps/productivity/penpot/app
  postBuild:
    substitute:
      APP: penpot-frontend
      SERVICE: penpot-frontend
      DEPLOYMENT: penpot-frontend
      PORT: "80"
      HOST: penpot.1337.pet
      COOLDOWN: "600"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: productivity
  wait: false
