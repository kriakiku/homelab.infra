---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nfs-mkdir
spec:
  interval: 1h
  path: ./kubernetes/apps/storage/nfs-mkdir/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage
  # Wait until the first reconcile marks the Deployment ready so dependents
  # (photoprism, paperless, …) see NFS dirs before they start.
  wait: true
  timeout: 5m
