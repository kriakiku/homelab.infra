---
# Falcosidekick WebUI — internal only (not on Cloudflare tunnel).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: falco-ui
spec:
  hostnames:
    - falco.1337.pet
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: falco-falcosidekick-ui
          port: 2802
