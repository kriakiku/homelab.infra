---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/job.json
apiVersion: batch/v1
kind: Job
metadata:
  name: homarr-seed-boards
  labels:
    app.kubernetes.io/name: homarr
    app.kubernetes.io/component: seed
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
    # Bump to force Job recreation after seed script / API key updates.
    seed.homarr.1337.pet/revision: "2"
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: curlimages/curl:8.14.1
          command: ["/bin/sh", "/scripts/seed.sh"]
          env:
            - name: HOMARR_URL
              value: http://homarr.network.svc.cluster.local:7575
            - name: BOARDS_DIR
              value: /seed/boards
            - name: HOMARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secret
                  key: HOMARR_API_KEY
                  optional: true
          volumeMounts:
            - name: boards
              mountPath: /seed/boards
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: { drop: [ALL] }
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: boards
          configMap:
            name: homarr-boards
        - name: scripts
          configMap:
            name: homarr-seed-script
            defaultMode: 0755
