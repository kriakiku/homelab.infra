---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-dns-to-udr
spec:
  # UniFi Network API lives on the UDR (VLAN 4). No internet egress needed —
  # external-dns only talks to kube-apiserver, CoreDNS, and this controller.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: unifi-dns
  egress:
    - toCIDRSet:
        - cidr: 10.10.4.1/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
