---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
spec:
  chartRef:
    kind: OCIRepository
    name: seaweedfs
  interval: 1h
  values:
    controllers:
      seaweedfs:
        containers:
          app:
            image:
              repository: chrislusf/seaweedfs
              tag: 3.85
            command:
              - /bin/sh
              - -c
            args:
              - |
                cat > /tmp/s3.json <<EOF
                {"identities":[{"name":"admin","credentials":[{"accessKey":"$SEAWEEDFS_S3_ACCESS_KEY","secretKey":"$SEAWEEDFS_S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
                EOF
                # volume.max / volumeSizeLimitMB: default 30Gi volumes exhausted
                # free space quickly and blocked new collections (e.g. pocket-id logos).
                exec /usr/bin/weed server -dir=/data -s3 -s3.config=/tmp/s3.json \
                  -volume.max=100 -master.volumeSizeLimitMB=1024
            envFrom:
              - secretRef:
                  name: seaweedfs-s3-secret
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /status
                    port: 9333
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /status
                    port: 9333
              startup:
                enabled: true
                spec:
                  httpGet:
                    path: /status
                    port: 9333
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 100m
                memory: 192Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      s3:
        ports:
          http:
            port: 8333
    persistence:
      data:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.internal.1337.pet
            path: /export/hdd/s3/eu-vno-1
