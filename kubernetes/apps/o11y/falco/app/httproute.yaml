---
# Falcosidekick WebUI — internal only (not on Cloudflare tunnel).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: falco-ui
  annotations:
    item.homer.rajsingh.info/name: "Falco"
    item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/falco.png"
    item.homer.rajsingh.info/subtitle: "Runtime Security"
    service.homer.rajsingh.info/name: "Security"
    service.homer.rajsingh.info/icon: "fa-solid fa-shield-halved"
spec:
  hostnames:
    - falco.1337.pet
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: falco-falcosidekick-ui
          port: 2802
