---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden
spec:
  components:
    - ../../../../components/keda-http-scale
  dependsOn:
    - name: pocket-id
      namespace: identity
    - name: cloudnative-pg-clusters
      namespace: databases
    - name: keda-http-add-on
      namespace: keda
  interval: 1h
  path: ./kubernetes/apps/identity/vaultwarden/app
  postBuild:
    substitute:
      APP: vaultwarden
      SERVICE: vaultwarden
      DEPLOYMENT: vaultwarden
      PORT: "80"
      HOST: vaultwarden.1337.pet
      COOLDOWN: "600"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: identity
  wait: false
