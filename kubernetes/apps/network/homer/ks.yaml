---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homer-operator
spec:
  interval: 1h
  path: ./kubernetes/apps/network/homer/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homer-instance
spec:
  dependsOn:
    - name: homer-operator
    - name: pocket-id
      namespace: identity
  interval: 1h
  path: ./kubernetes/apps/network/homer/instance
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homer-proxy
spec:
  # Scale oauth2-proxy to zero; Dashboard UI stays managed by homer-operator
  # (operator fights KEDA over Deployment replicas).
  components:
    - ../../../../components/keda-http-scale
  dependsOn:
    - name: homer-instance
    - name: keda-http-add-on
      namespace: keda
  interval: 1h
  path: ./kubernetes/apps/network/homer/proxy
  postBuild:
    substitute:
      APP: homer-proxy
      SERVICE: homer-proxy
      DEPLOYMENT: homer-proxy
      PORT: "4180"
      HOST: homer.1337.pet
      COOLDOWN: "600"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
