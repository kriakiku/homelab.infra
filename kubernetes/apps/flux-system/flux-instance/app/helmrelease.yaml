---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 1h
  values:
    commonAnnotations:
      fluxcd.controlplane.io/reconcileArtifactEvery: 1h
    instance:
      cluster:
        networkPolicy: false
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      sync:
        kind: GitRepository
        url: https://github.com/kriakiku/homelab.infra
        ref: refs/heads/main
        path: kubernetes/flux/cluster
        interval: 1h
      kustomize:
        patches:
          - # Homelab-sized concurrency — keep idle CPU low
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --concurrent=1
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --requeue-dependency=30s
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          - # Homelab memory limits — enough headroom without reserving 2Gi
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: all
              spec:
                template:
                  spec:
                    containers:
                      - name: manager
                        resources:
                          limits:
                            memory: 768Mi
            target:
              kind: Deployment
              name: (kustomize-controller|helm-controller|source-controller)
          - # Enable Helm repositories caching
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-max-size=10
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-ttl=60m
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --helm-cache-purge-interval=5m
            target:
              kind: Deployment
              name: source-controller
          - # Flux near OOM detection for Helm
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=OOMWatch=true
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-memory-threshold=95
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --oom-watch-interval=5s
            target:
              kind: Deployment
              name: helm-controller
          - # Default to retry on failure and disable chart digest tracking
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=DefaultToRetryOnFailure=true,DisableChartDigestTracking=true
            target:
              kind: Deployment
              name: helm-controller
          - # Watch configmaps and secrets attached to HelmReleases and Kustomizations
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --watch-configs-label-selector=owner!=helm
            target:
              kind: Deployment
              name: (helm-controller|kustomize-controller)
          - # Cancel health checks on new Kustomizations revisions
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --feature-gates=CancelHealthCheckOnNewRevision=true
            target:
              kind: Deployment
              name: kustomize-controller
          - # Quiet Flux controllers for Victoria Logs (error|info|debug only).
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/args/2
                value: --log-level=error
            target:
              kind: Deployment
              name: (source-controller|kustomize-controller|helm-controller)
          - # Quiet notification-controller (log-level is args[1]).
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/args/1
                value: --log-level=error
            target:
              kind: Deployment
              name: notification-controller
