---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: homarr-boards
    files:
      - config/boards/home.json
      - config/boards/personal.json
      - config/boards/security.json
      - config/boards/design-ai.json
      - config/boards/media.json
      - config/boards/observability.json
      - config/boards/infrastructure.json
  - name: homarr-seed-script
    files:
      - config/seed.sh
resources:
  - ./secret.sops.yaml
  - ./oidc.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./seed-job.yaml
