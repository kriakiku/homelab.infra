---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  interval: 1h
  chart:
    spec:
      chart: keda
      version: "2.20.1"
      sourceRef:
        kind: HelmRepository
        name: kedacore
  values:
    # Keep the control plane lean on the worker node.
    resources:
      operator:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
      metricServer:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      webhooks:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    prometheus:
      operator:
        enabled: true
        serviceMonitor:
          enabled: true
      metricServer:
        enabled: true
        serviceMonitor:
          enabled: true
      webhooks:
        enabled: true
        serviceMonitor:
          enabled: true
