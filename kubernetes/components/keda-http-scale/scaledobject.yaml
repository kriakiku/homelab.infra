---
# Requires Flux postBuild.substitute: APP, DEPLOYMENT, COOLDOWN
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ${APP}
spec:
  scaleTargetRef:
    name: ${DEPLOYMENT}
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: ${COOLDOWN}
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda.svc.cluster.local:9090
        interceptorRoute: ${APP}
