---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: one-api
spec:
  chartRef:
    kind: OCIRepository
    name: one-api
  interval: 1h
  values:
    controllers:
      one-api:
        annotations:
          # Reloader will restart the pod when one-api-oidc-credentials is created/updated
          # by pocket-id-operator, triggering the postStart OIDC auto-configuration.
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            # Internet egress so One API can relay requests to OpenAI, Anthropic, etc.
            egress: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18.1-system-trixie
            env:
              PGHOST: main-db-rw.databases.svc.cluster.local
              PGPORT: "5432"
              PGUSER: oneapi
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: main-db-oneapi-secret
                    key: password
              PGDATABASE: postgres
            command:
              - /bin/bash
              - -ec
              - |
                until pg_isready -q; do sleep 2; done
                psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
                SELECT 'CREATE DATABASE oneapi OWNER oneapi'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'oneapi')\gexec
                SQL
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
        containers:
          app:
            image:
              repository: docker.io/justsong/one-api
              tag: v0.6.10@sha256:e667221a2e197f005bdf3aba300885ac165fde37a0de9773e478678a9e04b24a
            env:
              PORT: "3000"
              TZ: Europe/Vilnius
              # Postgres backend — app auto-creates schema on first boot.
              SQL_DSN:
                valueFrom:
                  secretKeyRef:
                    name: one-api-secret
                    key: SQL_DSN
              SESSION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: one-api-secret
                    key: SESSION_SECRET
              INITIAL_ROOT_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: one-api-secret
                    key: INITIAL_ROOT_TOKEN
              INITIAL_ROOT_ACCESS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: one-api-secret
                    key: INITIAL_ROOT_ACCESS_TOKEN
              # OIDC credentials from pocket-id-operator.
              # optional=true — pod starts even if the secret doesn't exist yet;
              # Reloader will restart the pod once the secret is created,
              # and the postStart hook will configure OIDC automatically.
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: one-api-oidc-credentials
                    key: client_id
                    optional: true
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: one-api-oidc-credentials
                    key: client_secret
                    optional: true
            # After One API starts, configure OIDC and the public server address
            # using the admin access token and One API's option update endpoint.
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      set -e
                      # Wait until One API is accepting requests (max 60s).
                      i=0
                      until wget -q -O/dev/null http://localhost:3000/ 2>/dev/null; do
                        sleep 2; i=$((i+1)); [ $i -ge 30 ] && exit 0
                      done
                      # Helper function: update a single option.
                      opt() { wget -q -O/dev/null \
                        --header="Authorization: Bearer $INITIAL_ROOT_ACCESS_TOKEN" \
                        --header="Content-Type: application/json" \
                        --post-data="{\"key\":\"$1\",\"value\":\"$2\"}" \
                        http://localhost:3000/api/option 2>/dev/null || true; }
                      # Always set the public server address so OIDC callbacks resolve.
                      opt "ServerAddress" "https://one-api.1337.pet"
                      # Configure OIDC only when credentials are present.
                      if [ -n "$OIDC_CLIENT_ID" ] && [ -n "$OIDC_CLIENT_SECRET" ]; then
                        opt "OidcEnabled"      "true"
                        opt "OidcClientId"     "$OIDC_CLIENT_ID"
                        opt "OidcClientSecret" "$OIDC_CLIENT_SECRET"
                        opt "OidcWellKnown"    "https://auth.1337.pet/.well-known/openid-configuration"
                      fi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 5
            # One API binary runs as root (Go binary on Alpine).
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
                add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: one-api
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          item.homer.rajsingh.info/name: "One API"
          item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/one-api.png"
          item.homer.rajsingh.info/subtitle: "LLM API Gateway"
          service.homer.rajsingh.info/name: "AI"
          service.homer.rajsingh.info/icon: "fa-solid fa-brain"
        hostnames:
          - one-api.1337.pet
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      # /data is used by One API even with Postgres (logs dir, temp files).
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /tmp
