---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  chartRef:
    kind: OCIRepository
    name: paperless
  interval: 1h
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress: "true"
          # Paperless app runs as root; redis overrides uid below.
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          init-db:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18.1-system-trixie
            env:
              PGHOST: main-db-rw.databases.svc.cluster.local
              PGPORT: "5432"
              PGUSER: paperless
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paperless-secret
                    key: PAPERLESS_DBPASS
              PGDATABASE: postgres
            command:
              - /bin/bash
              - -ec
              - |
                until pg_isready -q; do sleep 2; done
                psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
                SELECT 'CREATE DATABASE paperless OWNER paperless'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'paperless')\gexec
                SQL
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
          # Debian Trixie paperless image only ships eng/deu/fra/ita/spa via apt.
          # Seed lit/ukr/rus from tessdata_fast onto a shared volume.
          init-tessdata:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.0.4
            command:
              - /bin/bash
              - -ec
              - |
                set -euo pipefail
                DEST=/tessdata
                mkdir -p "$DEST"
                cp -an /usr/share/tesseract-ocr/5/tessdata/. "$DEST/" || true
                cd "$DEST"
                for lang in lit ukr rus; do
                  if [[ ! -s "${lang}.traineddata" ]]; then
                    echo "Downloading ${lang}.traineddata"
                    curl -fsSL -o "${lang}.traineddata" \
                      "https://github.com/tesseract-ocr/tessdata_fast/raw/main/${lang}.traineddata"
                  fi
                done
                tesseract --list-langs
            env:
              TESSDATA_PREFIX: /tessdata
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.0.4
            env:
              PAPERLESS_URL: https://paperless.1337.pet
              PAPERLESS_ALLOWED_HOSTS: "*"
              PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.1337.pet
              PAPERLESS_CORS_ALLOWED_HOSTS: https://paperless.1337.pet
              PAPERLESS_PORT: &port 8000
              PAPERLESS_USE_X_FORWARD_HOST: "true"
              PAPERLESS_USE_X_FORWARD_PORT: "true"
              PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
              PAPERLESS_TIME_ZONE: Europe/Vilnius
              PAPERLESS_OCR_LANGUAGE: eng+lit+ukr+rus
              TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
              PAPERLESS_DBHOST: main-db-rw.databases.svc.cluster.local
              PAPERLESS_DBPORT: "5432"
              PAPERLESS_DBNAME: paperless
              PAPERLESS_DBUSER: paperless
              PAPERLESS_DB_OPTIONS: '{"sslmode":"disable"}'
              PAPERLESS_REDIS: redis://localhost:6379
              PAPERLESS_TIKA_ENABLED: "true"
              # Via KEDA HTTP interceptor (ExternalName → interceptor :8080).
              # Holds the request while paperless-tika scales 0→1.
              PAPERLESS_TIKA_ENDPOINT: http://paperless-tika-proxy:8080
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
              PAPERLESS_EMAIL_HOST: smtp-relay.mail.svc.cluster.local
              PAPERLESS_EMAIL_PORT: "25"
              PAPERLESS_EMAIL_FROM: paperless@kriakiku.dev
              PAPERLESS_EMAIL_USE_TLS: "false"
              PAPERLESS_EMAIL_USE_SSL: "false"
              PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
              PAPERLESS_DATA_DIR: /usr/src/paperless/data
              PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
              PAPERLESS_EMPTY_TRASH_DIR: /usr/src/paperless/trash
              PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
              PAPERLESS_DISABLE_REGULAR_LOGIN: "false"
              PAPERLESS_REDIRECT_LOGIN_TO_SSO: "false"
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: paperless-oidc-credentials
                    key: client_id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: paperless-oidc-credentials
                    key: client_secret
            envFrom:
              - secretRef:
                  name: paperless-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 90
                  periodSeconds: 5
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                drop: [ALL]
                add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          redis:
            image:
              repository: public.ecr.aws/docker/library/redis
              tag: 7.4-alpine
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [redis-cli, ping]
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [redis-cli, ping]
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

      tika:
        replicas: 0
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          app:
            image:
              repository: docker.io/apache/tika
              tag: 3.3.1.0-full
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /tika
                    port: &tikaPort 9998
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /tika
                    port: *tikaPort
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1536Mi

      gotenberg:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
        containers:
          app:
            image:
              repository: docker.io/gotenberg/gotenberg
              tag: "8.34.0"
            args:
              - gotenberg
              - --chromium-disable-javascript=true
              - --chromium-allow-list=file:///tmp/.*
              - --api-timeout=120s
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &gotenbergPort 3000
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *gotenbergPort
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: paperless
        ports:
          http:
            port: *port
      tika:
        controller: tika
        ports:
          http:
            port: *tikaPort
      gotenberg:
        controller: gotenberg
        ports:
          http:
            port: *gotenbergPort

    route:
      app:
        annotations:
          item.homer.rajsingh.info/name: "Paperless"
          item.homer.rajsingh.info/logo: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/paperlessngx.png"
          item.homer.rajsingh.info/subtitle: "Document Archive"
          service.homer.rajsingh.info/name: "Personal"
          service.homer.rajsingh.info/icon: "fa-solid fa-file-alt"
        hostnames:
          - paperless.1337.pet
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      # Search index / classification — NVMe
      data:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.1337.pet
            path: /export/nvme/paperless/data
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/data
      # OCR language packs (eng shipped in image; lit/ukr/rus downloaded once)
      tessdata:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.1337.pet
            path: /export/nvme/paperless/tessdata
        advancedMounts:
          paperless:
            init-tessdata:
              - path: /tessdata
            app:
              - path: /usr/share/tesseract-ocr/5/tessdata
      # Documents — HDD
      media:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.1337.pet
            path: /export/hdd/documents/paperless/media
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/media
      consume:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.1337.pet
            path: /export/hdd/documents/paperless/consume
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/consume
      export:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.1337.pet
            path: /export/hdd/documents/paperless/export
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/export
      trash:
        type: custom
        volumeSpec:
          nfs:
            server: nfs.1337.pet
            path: /export/hdd/documents/paperless/trash
        advancedMounts:
          paperless:
            app:
              - path: /usr/src/paperless/trash
      oidc-init:
        type: configMap
        name: paperless-oidc-init
        defaultMode: 0555
        advancedMounts:
          paperless:
            app:
              - path: /custom-cont-init.d/99-oidc-providers
                subPath: 99-oidc-providers
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        advancedMounts:
          paperless:
            app:
              - path: /tmp
          gotenberg:
            app:
              - path: /tmp
          tika:
            app:
              - path: /tmp
      redis-data:
        type: emptyDir
        advancedMounts:
          paperless:
            redis:
              - path: /data
