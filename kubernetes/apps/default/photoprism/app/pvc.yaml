---
# MariaDB data — keep local (fast queries). PhotoPrism does not support PostgreSQL.
# Originals/import/storage live on NFS HDD; only this DB needs a local volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-db
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
